<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pagamento pendente — Flash Despachante</title><style>
:root{
  --bg:#070806;--panel:#10110e;--panel2:#151611;--yellow:#ffc400;
  --text:#f5f5f0;--muted:#999b91;--line:#38330b;--ok:#20c875;--bad:#ff5a5f;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
  background:
    radial-gradient(circle at 50% 0%,rgba(255,196,0,.08),transparent 35%),
    var(--bg);
  color:var(--text);font-family:Arial,Helvetica,sans-serif;
}
.card{
  width:min(560px,100%);background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-radius:18px;padding:32px;
  box-shadow:0 24px 80px rgba(0,0,0,.45);
}
.brand{font-weight:900;letter-spacing:.08em;color:var(--yellow);font-size:14px;margin-bottom:28px}
.icon{
  width:58px;height:58px;border-radius:50%;display:grid;place-items:center;
  margin-bottom:22px;font-size:28px;font-weight:900;background:rgba(255,196,0,.1);
  border:1px solid rgba(255,196,0,.35);color:var(--yellow);
}
h1{font-size:28px;line-height:1.1;margin:0 0 12px}
p{color:var(--muted);line-height:1.6;margin:0 0 18px}
.status{
  margin:22px 0;padding:16px;border-radius:12px;background:#090a08;
  border:1px solid #292a24;color:#ddd;
}
.status strong{display:block;color:#fff;margin-bottom:5px}
.actions{display:grid;gap:10px;margin-top:24px}
.btn{
  display:block;text-align:center;text-decoration:none;border:0;border-radius:11px;
  padding:15px 18px;font-weight:900;font-size:13px;letter-spacing:.03em;cursor:pointer;
}
.primary{background:var(--yellow);color:#090909}
.secondary{background:transparent;color:#eee;border:1px solid #3b3c35}
.small{font-size:12px;color:#74766e;margin-top:18px}
.spinner{
  width:20px;height:20px;border:2px solid #555;border-top-color:var(--yellow);
  border-radius:50%;display:inline-block;vertical-align:-5px;margin-right:8px;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
</style></head>
<body><main class="card">
<div class="brand">FLASH DESPACHANTE</div><div class="icon">…</div>
<h1>Pagamento pendente</h1>
<p>O Mercado Pago ainda não confirmou a aprovação do pagamento. Assim que a confirmação ocorrer, o processamento do serviço poderá continuar.</p>
<div class="status"><strong>Aguardando confirmação</strong>Não faça um novo pagamento enquanto esta transação estiver pendente.</div>
<div class="actions"><a class="btn primary" href="/">Voltar para a Flash</a></div>
</main></body></html>
